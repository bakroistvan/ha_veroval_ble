# Publish a GitHub Release from a version tag.
#
# HACS uses the latest GitHub *release* (not a bare tag) as the remote version.
# After merging version-bump changes to main:
#   1. Update custom_components/veroval_ble/manifest.json "version"
#   2. Add a CHANGELOG.md section
#   3. git tag 0.2.0 && git push origin 0.2.0
# This workflow then creates the GitHub Release with generated notes.
#
# Tag names must match the manifest version (no "v" prefix), same as
# bodymiscale (CalVer) and Gree (SemVer).

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('custom_components/veroval_ble/manifest.json'))['version'])")
          echo "Tag: $TAG"
          echo "manifest.json version: $MANIFEST_VERSION"
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag '$TAG' does not match manifest version '$MANIFEST_VERSION'."
            echo "Bump custom_components/veroval_ble/manifest.json before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PRE_FLAG=()
          if [[ "$TAG" == *-* ]]; then
            PRE_FLAG=(--prerelease)
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "${PRE_FLAG[@]}"
