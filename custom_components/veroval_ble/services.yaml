force_dump:
  name: Force data sync
  description: Connect now and drain stored measurements, ignoring the advertise-window skip. Press User 1 or User 2 so Bluetooth flashes first.
  fields:
    device_id:
      required: false
      example: 8f4219cfa57e23f6f669c4616c2205e2
      selector:
        device:
          filter:
            integration: veroval_ble
          multiple: true
